name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm to latest (Trusted Publishing requires 11.5.1+)
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      # Validates the tarball that `changesets/action` will later publish via
      # `npm publish`. Uses `npm pack` (no registry call) to avoid the
      # "cannot publish over previously published versions" error that
      # `npm publish --dry-run` raises before changesets has bumped the
      # version. Provides early packaging-failure detection.
      - name: Verify package tarball (npm pack)
        run: npm pack --dry-run

      # changesets/action v2 is required for @changesets/cli v3: v1 detected
      # published packages by parsing CLI stdout, which v3 changed, so v1
      # published to npm but silently skipped git tags + GitHub releases
      # (3.2.3 and 3.2.4 shipped without either).
      - name: Create Release Pull Request or Publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npx changeset publish
          version-script: npx changeset version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: true
          github-token: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
